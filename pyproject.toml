[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analyste-ia-fiable"
version = "1.0.0"
description = "Mesurer la fiabilité d'un analyste IA sur des données d'entreprise, avec et sans couche sémantique."
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pyyaml>=6.0", "anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
